# ============================================================================
# gradle-wrapper.properties — versión de Gradle del proyecto
# ----------------------------------------------------------------------------
# Gradle 9.6.0 (distribución `-all`), presente y extraída en
# `~/.gradle/wrapper/dists/`, por lo que el wrapper NO descarga nada y el build
# `--offline` sigue siendo viable (verificado el 2026-09-21: APK construido).
#
# ¿POR QUÉ 9.x Y NO 8.14.3?
#   El Android Gradle Plugin compatible con la caché de Compose de esta máquina
#   es **AGP 9.1.0**, y AGP 9.x exige Gradle 9.x.
#
#   Motivo de fondo: la caché de Compose solo tiene el BOM 2026.09.00 →
#   Compose 1.12.1, y Compose 1.12.1 declara `minCompileSdk=37` y
#   `minAndroidGradlePluginVersion=9.1.0` en su metadata. Con AGP 8.11.1 /
#   compileSdk 36 el build falla en `checkDebugAarMetadata` (comprobado).
#
# ⚠️ NOTA HISTÓRICA: este archivo decía 9.3.1. La noche del 2026-09-20 (23:16)
#   el asistente de actualización de Android Studio lo subió a 9.6.0 **a la
#   vez** que subía AGP a 9.4.1. El AGP hubo que revertirlo a 9.1.0 (su aapt2 no
#   estaba en la caché); **Gradle 9.6.0 sí funciona y se ha dejado**.
# ============================================================================
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-all.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
