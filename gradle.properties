# ============================================================================
# gradle.properties — flags del build
# ----------------------------------------------------------------------------
# Ajustes compartidos por todo el build. Se mantienen deliberadamente
# conservadores para que el build `--offline` sea reproducible.
# ============================================================================

# Memoria del daemon de Gradle. 2 GB es suficiente para un módulo de este tamaño
# y evita reservar más de la cuenta en una máquina de desarrollo.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Android: obligatorio usar AndroidX (no se usan las support libraries legacy).
android.useAndroidX=true

# R class no transitiva: cada módulo solo ve sus propios recursos (build más
# rápido y menos colisiones de recursos).
android.nonTransitiveRClass=true

# Estilo oficial de código Kotlin.
kotlin.code.style=official

# Caché de build y ejecución en paralelo (seguro para un único módulo).
org.gradle.caching=true
org.gradle.parallel=true

# No fallar por el SDK de compilación: la caché de Compose de esta máquina
# exige compileSdk 37 (Compose 1.12.1 lo declara en su metadata). Se deja
# explícito para que quede documentado el motivo, no como parche.
# AGP 9.1.0 solo fue probado hasta compileSdk 36.1; se silencia el aviso
# indicando ambas formas (37 y 37.0).
android.suppressUnsupportedCompileSdk=37,37.0

# ---------------------------------------------------------------------------
# AGP 9: se DESACTIVAN las dos novedades para mantener el DSL y el flujo de
# Kotlin "clásicos" (los mismos que usa el resto de la documentación del
# proyecto). Con el Kotlin "built-in" de AGP 9 activo, el propio AGP **prohíbe**
# aplicar el plugin `org.jetbrains.kotlin.android` (error verificado), y su DSL
# nuevo cambia la forma del bloque `android { }`. Desactivándolos, el build
# sigue siendo exactamente el esperado y el `build.gradle.kts` del módulo no
# necesita reescribirse.
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
